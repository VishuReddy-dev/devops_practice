---
# tasks file for docker_app
- name: Install Docker on Amazon linux
  dnf: 
    name: docker
    state: present

  become: yes
  when: 
    ansible_os_family=="RedHat"

- name: Install utilites
  dnf: 
   name: "{{item}}"
   state: present
  loop:
    - git
    - wget
    - curl
  ignore_errors: yes
  become: yes
- name: Start docker 
  service:
    name: docker 
    state: started
    enabled: yes
  become: yes
- name: Deploy template
  template:
   src: index.j2
   dest: /tmp/index.html
  notify: 
    - Restart Container

- name: Pull nginx image
  shell: docker pull {{ docker_image }}
  become: yes
- name: Remove old container
  shell: docker rm -f {{ container_name }}
  ignore_errors: yes

  become: yes
- name: Run container

  shell: |
      docker run -d \
      --name {{ container_name }} \
      -p {{ host_port }}:{{ container_port }} \
      {{ docker_image }}

  become: yes

